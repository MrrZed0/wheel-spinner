 "Circ Out":function(t){return Math.sqrt(1-Math.pow(t-1,2));},
 "Heavy Drag":function(t){return 1-Math.pow(1-t,7);},
 "Feather Stop":function(t){return 1-Math.pow(1-t,2.4)*(1-0.12*Math.sin(t*Math.PI*3));},
 "Slow Tail":function(t){return t<0.7?(t/0.7)*0.93:0.93+0.07*(1-Math.pow(1-(t-0.7)/0.3,3));},
 "Double Stage":function(t){return t<0.5?0.72*(1-Math.pow(1-t/0.5,3)):0.72+0.28*(1-Math.pow(1-(t-0.5)/0.5,4));},
 "Tease & Kick":function(t){return t<0.6?0.35*(1-Math.pow(1-t/0.6,2)):0.35+0.65*(1-Math.pow(1-(t-0.6)/0.4,4));},
 "Ratchet":function(t){var e=1-Math.pow(1-t,4);return e+Math.sin(t*Math.PI*14)*0.012*(1-t);},
 "Stutter Stop":function(t){var e=1-Math.pow(1-t,3);return e-Math.max(0,Math.sin(t*Math.PI*6))*0.018*(1-t);},
 "Back Out":function(t){var c=1.70158,p=t-1;return 1+(c+1)*p*p*p+c*p*p;},
 "Soft Back":function(t){var c=0.8,p=t-1;return 1+(c+1)*p*p*p+c*p*p;},
 "Elastic Out":function(t){if(t===0||t===1)return t;var p=0.42;return Math.pow(2,-11*t)*Math.sin((t-p/4)*(2*Math.PI)/p)+1;},
 "Bounce Out":function(t){var n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+0.75;}if(t<2.5/d){t-=2.25/d;return n*t*t+0.9375;}t-=2.625/d;return n*t*t+0.984375;},
 "Magnet Snap":function(t){var e=1-Math.pow(1-t,5);return e+(1-e)*Math.pow(t,9);}
};
/* Wind-up curves: the wheel creeps off the mark, builds to full speed, holds
   it for several rotations, then bleeds off into a long settle. Built from a
   velocity profile and integrated in closed form, so the position is smooth
   and always lands exactly on the target.
     a = how long it spends accelerating   b = where it starts slowing
     k = how long the tail drags (higher = longer coast)            */
(function(){
  function windup(a,b,k){
    var T=0.5*a+(b-a)+(1-b)/(k+1);
    return function(t){
      if(t<=0)return 0;
      if(t>=1)return 1;
      var P;
      if(t<a){var x=t/a;P=a*(x*x*x-0.5*x*x*x*x);}
      else if(t<b){P=0.5*a+(t-a);}
      else {var u=(t-b)/(1-b);P=0.5*a+(b-a)+(1-b)*(1-Math.pow(1-u,k+1))/(k+1);}
      return P/T;
    };
  }
  EASE["Wind Up"]        =windup(0.25,0.70,2);
  EASE["Slow Build"]     =windup(0.40,0.75,2);
  EASE["Crank Up"]       =windup(0.15,0.60,3);
  EASE["Long Build"]     =windup(0.50,0.80,2);
  EASE["Build & Drift"]  =windup(0.30,0.55,4);
  EASE["Pull Start"]     =windup(0.20,0.80,1.6);
  EASE["Creep & Launch"] =windup(0.45,0.65,3);
  EASE["Gear Up"]        =windup(0.35,0.78,2.5);
})();

 /* Creates the context if needed, resumes it if the browser suspended it,

   if(!this.ctx){
     try{
       var AC=window.AudioContext||window.webkitAudioContext;
       this.ctx=new AC();
       this.master=this.ctx.createGain();
       this.master.connect(this.ctx.destination);
     }catch(e){return false;}
   }
   if(this.ctx.state==="suspended"){try{this.ctx.resume();}catch(e){}}
   var v=this.snd().volume;
   this.master.gain.value=(v==null?0.6:v);
   return this.ctx.state==="running";
 },

   var o=c.createOscillator(),g=c.createGain();o.type=type;

   if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
   g.gain.setValueAtTime(0.0001,t0);
   g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),t0+Math.min(0.03,dur*0.2));

  if(k==="marble"){
    function vein(col,n,w,len){
      x.strokeStyle=col;
      for(var v=0;v<n;v++){
        x.lineWidth=w*(0.4+Math.random());x.beginPath();
        var vx=Math.random()*SIZE,vy=Math.random()*SIZE;x.moveTo(vx,vy);
        for(var q=0;q<6;q++){vx+=(Math.random()-.5)*len;vy+=(Math.random()-.5)*len;x.lineTo(vx,vy);}
        x.stroke();
      }
    }
    vein("rgba(255,255,255,.38)",26,2,62);
    vein("rgba(50,50,62,.26)",18,1.6,70);

function layout(){
  var w=window.innerWidth,h=window.innerHeight;
  fxC.width=w*DPR;fxC.height=h*DPR;fxC.style.width=w+"px";fxC.style.height=h+"px";
  fctx.setTransform(DPR,0,0,DPR,0,0);
  wheelC.width=SIZE*DPR;wheelC.height=SIZE*DPR;wheelC.style.width=SIZE+"px";wheelC.style.height=SIZE+"px";
  wctx.setTransform(DPR,0,0,DPR,0,0);
  var a=C.layout.anchor,ox=C.layout.offsetX,oy=C.layout.offsetY;
  var st={};
  if(a.indexOf("left")>=0){st.left=(20+ox)+"px";st.right="auto";}
  else if(a.indexOf("right")>=0){st.right=(20-ox)+"px";st.left="auto";}
  else {st.left="50%";st.marginLeft=(-SIZE/2+ox)+"px";}
  if(a.indexOf("top")>=0){st.top=(20+oy)+"px";st.bottom="auto";}
  else if(a.indexOf("bottom")>=0){st.bottom=(20-oy)+"px";st.top="auto";}
  else {st.top="50%";st.marginTop=(-(SIZE+70)/2+oy)+"px";}
  for(var k in st)wrap.style[k]=st[k];
  var cp=C.reveal.pos||"Over wheel",wy=wrap.getBoundingClientRect();
  var wcy=wy.height?wy.top+wy.height/2:h/2;
  var ch=cardWrap.getBoundingClientRect().height||150;
  if(cp==="Below wheel")cardWrap.style.top=Math.min(h-ch-20,wcy+SIZE/2+18)+"px";
  else if(cp==="Above wheel")cardWrap.style.top=Math.max(12,wcy-SIZE/2-ch-18)+"px";
  else if(cp==="Screen bottom")cardWrap.style.top=(h-ch-28)+"px";
  else if(cp==="Screen top")cardWrap.style.top="28px";
  else cardWrap.style.top=(wcy-ch/2)+"px";
  var ti=$("title");
  ti.style.display=C.layout.showTitle?"block":"none";
  ti.textContent=C.layout.title;
  if(FTI.family){
    window.WheelFonts.apply(ti,FTI,FTI.size||30);
    if(!FTI.color)ti.style.color=C.layout.titleColor;
  } else ti.style.color=C.layout.titleColor;
  var cn=$("count");
  if(FTI.family)cn.style.fontFamily=window.WheelFonts.stack(FTI.family);
  $("count").style.display=C.behaviour.showCount?"block":"none";
}
window.addEventListener("resize",layout);

/* ---------- colour helpers ---------- */
function hex2rgb(h){h=h.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgba(h,a){var c=hex2rgb(h);return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
function shade(h,p){var c=hex2rgb(h);var f=p<0?0:255,t=p<0?-p:p;
  return "#"+[0,1,2].map(function(i){var v=Math.round((f-c[i])*t+c[i]);return ("0"+v.toString(16)).slice(-2);}).join("");}
function pick(i){return COLORS[i%COLORS.length];}

/* =================== WHEEL RENDER =================== */
function seg(){return entries.length?(Math.PI*2/entries.length):Math.PI*2;}
function drawWheel(){
  var w=SIZE,cx=w/2,cy=w/2,rim=FAMI.rimW,R=w/2-rim-4;
  wctx.clearRect(0,0,w,w);
  var n=entries.length;
  /* backplate */
  wctx.save();
  wctx.beginPath();wctx.arc(cx,cy,R+rim,0,Math.PI*2);
  if(FAMI.rimMode==="metal"){
    var g=wctx.createLinearGradient(0,0,w,w);
    g.addColorStop(0,"#f2f4f8");g.addColorStop(.25,"#8e97a8");g.addColorStop(.5,"#f8fbff");
    g.addColorStop(.75,"#6d7584");g.addColorStop(1,"#e4e9f1");wctx.fillStyle=g;
  }else if(FAMI.rimMode==="grad"){
    var g2=wctx.createLinearGradient(0,0,0,w);
    g2.addColorStop(0,shade(rimColor,.35));g2.addColorStop(1,shade(rimColor,-.35));wctx.fillStyle=g2;
  }else wctx.fillStyle=rimColor;
  if(FAMI.rimGlow){wctx.shadowBlur=FAMI.rimGlow;wctx.shadowColor=rimColor;}
  wctx.fill();wctx.restore();

  if(!n){
    wctx.save();wctx.beginPath();wctx.arc(cx,cy,R,0,Math.PI*2);
    if(innerR(R)>0)wctx.arc(cx,cy,innerR(R),0,Math.PI*2,true);
    wctx.fillStyle="rgba(10,12,18,.85)";wctx.fill();
    wctx.fillStyle=rgba(txtColor,.6);wctx.textAlign="center";wctx.textBaseline="middle";
    wctx.font="600 20px system-ui";wctx.fillText("No entries yet",cx,cy);wctx.restore();
    drawHub(cx,cy,R);drawPointer(cx,cy,R+rim);return;
  }
  var sa=seg(),IR=innerR(R);
  for(var i=0;i<n;i++){
    var a0=rot+i*sa,a1=a0+sa;
    wctx.save();
    segPath(cx,cy,IR,R,a0,a1);
    wctx.clip();
    paintSeg(cx,cy,R,a0,a1,pick(i),i,n);
    wctx.restore();
    if(borderW>0){
      wctx.save();segPath(cx,cy,IR,R,a0,a1);
      wctx.lineWidth=borderW;wctx.strokeStyle=FAMI.seg==="outline"?pick(i):rgba("#000000",.45);
      if(FAMI.seg==="neon"){wctx.strokeStyle=pick(i);wctx.shadowBlur=16;wctx.shadowColor=pick(i);}
      wctx.stroke();wctx.restore();
    }
  }
  if(TEX){
    wctx.save();
    wctx.beginPath();wctx.arc(cx,cy,R,0,Math.PI*2);
    if(IR>0){wctx.arc(cx,cy,IR,0,Math.PI*2,true);}
    wctx.clip();
    wctx.globalAlpha=TEX.a;
    if(TEX.rot){wctx.translate(cx,cy);wctx.rotate(rot);wctx.drawImage(TEX.c,-SIZE/2,-SIZE/2);}
    else wctx.drawImage(TEX.c,cx-SIZE/2,cy-SIZE/2);
    wctx.restore();
  }
  for(var j=0;j<n;j++)drawLabel(cx,cy,R,rot+j*sa+sa/2,entries[j],sa,n,j);
  drawHub(cx,cy,R);
  drawPointer(cx,cy,R+rim);
}
function paintSeg(cx,cy,R,a0,a1,col,i,n){

function fillWedge(cx,cy,R,a0,a1){wctx.beginPath();wctx.moveTo(cx,cy);wctx.arc(cx,cy,R,a0,a1);wctx.closePath();wctx.fill();}
function drawLabel(cx,cy,R,mid,ent,sa,n,i){

  if(FL.upper)t=t.toUpperCase();
  var na=((mid%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  var flip=(na>Math.PI*0.5&&na<Math.PI*1.5);
  wctx.save();wctx.translate(cx,cy);wctx.rotate(mid);

function drawHub(cx,cy,R){

function showCard(w){

  $("cLbl").textContent=C.reveal.label;

    window.WheelFonts.apply($("cItem"),FC,FC.size||46);
    var lb=$("cLbl"),us=$("cUsr");
    lb.style.fontFamily=us.style.fontFamily=window.WheelFonts.stack(FC.family);

function hideWheel(){
  var an=EX_MAP[C.behaviour.exitAnim];
  if(!an){wrap.classList.remove("vis");return;}
  wrap.style.animation=an+" .6s ease both";
  setTimeout(function(){wrap.classList.remove("vis");wrap.style.animation="";},620);
}

/* =================== SPIN =================== */
function doSpin(idx){
  if(spinning)return;
  if(!entries.length)return;
  AU.init();
  clearTimeout(hideTimer);hideCard();
  spinning=true;revealing=false;winIdx=idx;winner=entries[idx];
  showWheel();
  FX.stop();FX.start(FXSPIN,"spin",spinMs);
  AU.spin(spinMs);
  var sa=seg();
  var jitter=(Math.random()-0.5)*sa*0.6;
  var target=-Math.PI/2-(idx+0.5)*sa+jitter;
  var start=rot%(Math.PI*2);
  var end=target-Math.PI*2*turns;
  while(end>start)end-=Math.PI*2;
  var t0=performance.now();
  lastTickSeg=-1;
  (function anim(now){
    var t=Math.min(1,(now-t0)/spinMs);
    rot=start+(end-start)*easeFn(t);
    var segNow=Math.floor((-rot-Math.PI/2)/sa);
    if(segNow!==lastTickSeg){lastTickSeg=segNow;if(t<0.995)AU.playTick();}
    if(t<1)requestAnimationFrame(anim);else finish();
  })(t0);
}
function finish(){
  spinning=false;revealing=true;
  AU.stopSpin();AU.win();
  FX.stop();FX.start(FXWIN,"win",holdMs);
  showCard(winner);
  hideTimer=setTimeout(function(){
    revealing=false;hideCard();FX.stop();
    /* winner already removed server-side; catch up locally too */
    if(pending){entries=pending;pending=null;}
    else if(winIdx>=0&&entries[winIdx]===winner)entries.splice(winIdx,1);
    winIdx=-1;winner=null;updateCount();
    if(!C.behaviour.idleShow)hideWheel();
  },holdMs);
}
function updateCount(){
  $("count").textContent=entries.length+" ENTR"+(entries.length===1?"Y":"IES");
}

/* =================== LOOP =================== */
var last=performance.now();
(function loop(now){
  var dt=Math.min(50,now-last);last=now;
  drawWheel();FX.step(dt);
  if(PREVIEW_AUDIO_HINT&&AU.unlocked()){PREVIEW_AUDIO_HINT=false;sndHint.style.display="none";}
  requestAnimationFrame(loop);
})(last);

/* =================== NETWORK =================== */
function applyEntries(list){
  /* never reshuffle the wheel mid-spin or behind the winner card — queue it */
  if(spinning||revealing){pending=(list||[]).slice();return;}
  entries=(list||[]).slice();updateCount();
}
function handle(msg){
  var ev=msg.wheelEvent;if(!ev)return;
  if(ev==="sync"||ev==="add"||ev==="remove"||ev==="clear"){
    applyEntries(msg.entries);
    if(C.behaviour.idleShow)showWheel();
  } else if(ev==="spin"){
    /* a new spin always wins: cut any reveal still on screen short */
    if(revealing){revealing=false;clearTimeout(hideTimer);hideCard();FX.stop();}
    pending=null;spinning=false;
    entries=(msg.entries||[]).slice();updateCount();
    var idx=(typeof msg.winnerIndex==="number")?msg.winnerIndex:0;
    doSpin(Math.max(0,Math.min(entries.length-1,idx)));
  } else if(ev==="show"){showWheel();}
  else if(ev==="hide"){hideWheel();}
}
function connect(){
  if(PREVIEW)return;
  var ws;
  try{ws=new WebSocket(C.ws.url);}catch(e){setTimeout(connect,C.ws.reconnectMs);return;}
  ws.onopen=function(){
    try{ws.send(JSON.stringify({request:"Subscribe",events:{General:["Custom"]},id:"wheel-sub"}));}catch(e){}
    try{ws.send(JSON.stringify({request:"DoAction",action:{name:C.ws.syncAction},args:{wheelMode:"sync"},id:"wheel-sync"}));}catch(e){}
  };
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data);}catch(err){return;}
    if(m.wheelEvent)handle(m);
    else if(m.data&&m.data.wheelEvent)handle(m.data);
    else if(m.data&&typeof m.data.json==="string"){try{handle(JSON.parse(m.data.json));}catch(e2){}}
  };
  ws.onclose=function(){setTimeout(connect,C.ws.reconnectMs);};
  ws.onerror=function(){try{ws.close();}catch(e){}};
}

/* =================== PREVIEW BRIDGE =================== */
if(PREVIEW){
  var demo=["Grand Theft Auto V","Hollow Knight","Elden Ring","Stardew Valley","Dark Souls III","Hades",
            "Celeste","Outer Wilds","Portal 2","Minecraft","Terraria","Cuphead"];
  var users=["PixelDave","Nova_Kat","Trimbly","Zeeko","mochi_","Ravenlol","BitCrush","Quill","Dorp","Sable","Kix","Marrow"];
  window.addEventListener("message",function(e){
    var d=e.data||{};
    if(d.cmd==="spin"){if(entries.length)doSpin((Math.random()*entries.length)|0);}
    else if(d.cmd==="add"){entries.push({user:users[(Math.random()*users.length)|0],item:demo[(Math.random()*demo.length)|0]});updateCount();}
    else if(d.cmd==="reset"){entries=[];for(var i=0;i<8;i++)entries.push({user:users[i],item:demo[i]});updateCount();clearTimeout(hideTimer);hideCard();FX.stop();spinning=false;showWheel();}
  });
}

layout();updateCount();
if(C.behaviour.idleShow||PREVIEW)showWheel();
connect();
})();
</script>
